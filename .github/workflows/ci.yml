name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Banco só de testes, para os testes de integração dos repositórios.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tempmail
          POSTGRES_PASSWORD: tempmail
          POSTGRES_DB: tempmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tempmail -d tempmail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://tempmail:tempmail@localhost:5432/tempmail_test
      - run: npm run build
